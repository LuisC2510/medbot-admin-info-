<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Triage de Urgencias | Universidad Santiago de Cali</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏥</text></svg>">
  
  <!-- Fuente e iconos -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS para diseño limpio -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Estilos propios sencillos -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased font-sans min-h-screen flex flex-col">

  <!-- BANNER SENCILLO: MODO EMERGENCIA / DESASTRE -->
  <div id="global-emergency-banner" class="hidden emergency-banner-active px-4 py-2 text-center text-xs sm:text-sm font-bold uppercase tracking-wide flex items-center justify-center gap-2">
    <span>⚠️ MODO EMERGENCIA / CONTINGENCIA ACTIVO: Tiempos de espera normativos suspendidos temporalmente</span>
  </div>

  <!-- PANTALLA DE INICIO DE SESIÓN Y 2FA MICROSOFT -->
  <div id="auth-container"></div>

  <!-- APLICACIÓN PRINCIPAL (CUANDO YA INICIÓ SESIÓN) -->
  <div id="app-container" class="hidden flex-1 flex flex-col md:flex-row min-h-screen">
    
    <!-- BARRA LATERAL SENCILLA (SIDEBAR) -->
    <aside class="w-full md:w-64 bg-white border-r border-slate-200 flex-shrink-0 flex flex-col justify-between">
      <div>
        <!-- Logotipo Institucional Sencillo -->
        <div class="p-4 border-b border-slate-200 flex items-center gap-3">
          <div class="w-10 h-10 rounded-lg bg-blue-600 text-white flex items-center justify-center font-bold text-lg">
            🏥
          </div>
          <div>
            <h2 class="text-sm font-bold text-slate-800 leading-tight">Triage Urgencias</h2>
            <p class="text-xs text-blue-600 font-semibold">Res. 5596 de 2015</p>
            <p class="text-[11px] text-slate-400">Univ. Santiago de Cali</p>
          </div>
        </div>

        <!-- Menú de Navegación por Rol -->
        <div class="p-3">
          <p class="px-2 py-1 text-xs font-bold text-slate-400 uppercase tracking-wider">Menú</p>
          <nav id="sidebar-navigation" class="space-y-1 mt-1">
            <!-- Se llena con app.js según el rol -->
          </nav>
        </div>
      </div>

      <!-- Pie de la barra lateral: Datos del Usuario y Botón Salir -->
      <div class="p-4 border-t border-slate-200 bg-slate-50">
        <div class="mb-3">
          <p id="header-user-name" class="text-xs font-bold text-slate-800 truncate">Nombre Usuario</p>
          <span id="header-user-role" class="text-[11px] font-semibold text-blue-700">ROL</span>
        </div>

        <button id="btn-logout" class="w-full py-1.5 px-3 text-xs font-semibold text-red-600 bg-red-50 hover:bg-red-100 rounded border border-red-200 flex items-center justify-center gap-1.5 transition-colors">
          <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
          <span>Cerrar Sesión</span>
        </button>
      </div>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="flex-1 flex flex-col min-h-screen bg-slate-50">
      
      <!-- Barra Superior (Header) -->
      <header class="bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between sticky top-0 z-20">
        <div class="flex items-center gap-2">
          <span class="text-xs font-bold text-blue-700 bg-blue-50 border border-blue-200 px-2.5 py-1 rounded">
            Servicio de Urgencias
          </span>
          <span class="text-xs text-slate-400">• Hospital Universitario</span>
        </div>

        <div class="flex items-center gap-3">
          <span id="socket-status-badge"></span>
          <span id="topbar-live-clock" class="digital-clock text-xs font-bold text-slate-600"></span>
        </div>
      </header>

      <!-- Vista que se muestra según la opción elegida -->
      <div id="main-view-container" class="p-4 md:p-6 flex-1 max-w-7xl w-full mx-auto">
        <!-- Renderizado dinámico -->
      </div>
    </main>

  </div>

  <!-- VENTANA MODAL SENCILLA PARA FORMULARIOS Y ACCIONES -->
  <div id="modal-container" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-xs overflow-y-auto">
    <div id="modal-content-box" class="bg-white rounded-xl shadow-lg border border-slate-200 w-full max-w-2xl overflow-hidden my-6 max-h-[90vh] overflow-y-auto">
      <!-- Se inyecta con App.abrirModal -->
    </div>
  </div>

  <!-- CONTENEDOR DE MENSAJES TOAST -->
  <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 max-w-sm w-full"></div>

  <!-- SCRIPTS -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/api.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/socket.js"></script>
  <script src="js/views/tablero.view.js"></script>
  <script src="js/views/admisiones.view.js"></script>
  <script src="js/views/pacientes.view.js"></script>
  <script src="js/views/enfermeria.view.js"></script>
  <script src="js/views/medico.view.js"></script>
  <script src="js/views/admin.view.js"></script>
  <script src="js/app.js"></script>

  <!-- Reloj de la barra superior -->
  <script>
    function actualizarReloj() {
      const el = document.getElementById('topbar-live-clock');
      if (el) {
        const ahora = new Date();
        el.textContent = ahora.toLocaleTimeString('es-CO');
      }
    }
    setInterval(actualizarReloj, 1000);
    actualizarReloj();
  </script>
</body>
</html>
