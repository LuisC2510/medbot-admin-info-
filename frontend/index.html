<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Triage de Urgencias | Universidad Santiago de Cali</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏥</text></svg>">
  
  <!-- Fuente e iconos -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Estilos propios sencillos -->
  <link rel="stylesheet" href="css/styles.css?v=3">
</head>
<body class="bg-slate-50 text-slate-800 antialiased font-sans h-screen overflow-hidden flex flex-col">

  <!-- BANNER: MODO EMERGENCIA / DESASTRE -->
  <div id="global-emergency-banner" class="hidden emergency-banner-active px-4 py-2 text-center text-xs sm:text-sm font-bold uppercase tracking-wide flex items-center justify-center gap-2 z-50">
    <span>⚠️ MODO EMERGENCIA / CONTINGENCIA ACTIVO: Tiempos normativos de espera suspendidos temporalmente (Res. 5596/2015)</span>
  </div>

  <!-- PANTALLA DE INICIO DE SESIÓN Y 2FA MICROSOFT -->
  <div id="auth-container" class="h-screen overflow-y-auto"></div>

  <!-- APLICACIÓN PRINCIPAL (CUANDO YA INICIÓ SESIÓN) -->
  <div id="app-container" class="hidden flex-1 flex flex-col md:flex-row h-screen overflow-hidden">
    
    <!-- BARRA LATERAL FIJA (SIDEBAR NUNCA SE DESPLAZA NI SE PIERDE) -->
    <aside class="w-full md:w-60 bg-white border-r border-slate-200 flex-shrink-0 flex flex-col h-full shadow-xs">
      <!-- Logotipo Institucional Sencillo -->
      <div class="p-4 border-b border-slate-200 flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-lg bg-blue-600 text-white flex items-center justify-center font-bold text-base shadow-xs">
          🏥
        </div>
        <div>
          <h2 class="text-sm font-bold text-slate-800 leading-tight">Triage Urgencias</h2>
        </div>
      </div>

      <!-- Menú de Navegación por Rol -->
      <div class="p-3 flex-1 overflow-y-auto">
        <p class="px-2 py-1 text-[11px] font-bold text-slate-500 uppercase tracking-wider">Menú</p>
        <nav id="sidebar-navigation" class="space-y-1 mt-1">
          <!-- Se llena con app.js según el rol -->
        </nav>
      </div>

      <!-- Pie del Sidebar -->
      <div class="p-3 border-t border-slate-300 bg-slate-100 text-center">
        <p class="text-[11px] text-slate-600">Proyecto Académico • MedBot</p>
      </div>
    </aside>

    <!-- ÁREA PRINCIPAL CON HEADER FIJO ARRIBA -->
    <div class="flex-1 flex flex-col h-full overflow-hidden">
      
      <!-- HEADER FIJO ARRIBA -->
      <header class="bg-blue-900 text-white border-b border-blue-950 px-4 py-2.5 flex items-center justify-between flex-shrink-0 z-20">
        
        <!-- Izquierda: Estado del Servicio -->
        <div class="flex items-center gap-2">
          <span class="text-xs font-bold text-white bg-blue-800 border border-blue-700 px-2 py-0.5 rounded">
            Hospital Universitario
          </span>
          <span id="socket-status-badge"></span>
        </div>

        <!-- Centro: Reloj en vivo -->
        <div class="hidden sm:flex items-center gap-1.5 text-xs font-semibold text-blue-100">
          <span>⏰</span>
          <span id="topbar-live-clock" class="digital-clock"></span>
        </div>

        <!-- Derecha: Perfil del Usuario y Botón Salir -->
        <div class="flex items-center gap-2.5">
          <div class="text-right">
            <span id="header-user-name" class="text-xs font-bold text-white block truncate max-w-[160px]">Usuario</span>
            <span id="header-user-role" class="text-[10px] font-bold uppercase block text-blue-200">ROL</span>
          </div>

          <button id="btn-logout" title="Cerrar Sesión" class="px-2.5 py-1.5 text-xs font-semibold text-white bg-red-700 hover:bg-red-800 rounded border border-red-800 flex items-center gap-1">
            <span>Salir</span>
          </button>
        </div>
      </header>

      <!-- VISTA DINÁMICA CON SCROLL INDEPENDIENTE (SÓLO EL CONTENIDO SE DESPLAZA) -->
      <main id="main-view-container" class="p-4 md:p-6 flex-1 overflow-y-auto max-w-7xl w-full mx-auto">
        <!-- Renderizado dinámico -->
      </main>

    </div>

  </div>

  <!-- VENTANA MODAL PARA FORMULARIOS, 2FA Y RECLASIFICACIONES -->
  <div id="modal-container" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-xs overflow-y-auto">
    <div id="modal-content-box" class="bg-white rounded-xl shadow-xl border border-slate-200 w-full max-w-2xl overflow-hidden my-6 max-h-[90vh] overflow-y-auto">
      <!-- Se inyecta dinámicamente -->
    </div>
  </div>

  <!-- TOAST NOTIFICACIONES -->
  <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 max-w-sm w-full"></div>

  <!-- SCRIPTS CON CONTROL DE CACHÉ ?v=4 -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/api.js?v=5"></script>
  <script src="js/timer.js?v=4"></script>
  <script src="js/socket.js?v=4"></script>
  <script src="js/views/tablero.view.js?v=4"></script>
  <script src="js/views/admisiones.view.js?v=4"></script>
  <script src="js/views/pacientes.view.js?v=4"></script>
  <script src="js/views/enfermeria.view.js?v=4"></script>
  <script src="js/views/medico.view.js?v=4"></script>
  <script src="js/views/admin.view.js?v=4"></script>
  <script src="js/app.js?v=4"></script>
</body>
</html>
